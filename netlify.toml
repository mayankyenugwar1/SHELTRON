# SHELTRON Monorepo Netlify Configuration
# Enables zero-config one-click deployment when repository root is linked to Netlify

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA client-side routing fallback rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
